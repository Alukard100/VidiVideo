services:
  api:
    build:
      context: .
      dockerfile: Backend/src/VidiVideo.Api/Dockerfile
    env_file:
      - .env
    ports:
      - "5000:8080"
    volumes:
      - image-data:/app/wwwroot/images
      - video-data:/app/storage/videos
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Backend/src/VidiVideo.Worker/Dockerfile
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${VIDIVIDEO_MSSQL_SA_PASSWORD}"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: "${VIDIVIDEO_RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${VIDIVIDEO_RABBITMQ_DEFAULT_PASSWORD}"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


volumes:
  sqlserver-data:
  image-data:
  video-data:
